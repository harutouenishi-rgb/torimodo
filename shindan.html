<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>トリモド｜3分診断</title>
<meta name="description" content="あなたが取りこぼしている補助金・助成金・控除制度を3分で診断。完全無料。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F4EFE6;--ink:#1A2419;--green:#2C4A38;--green-deep:#0F2419;
--gold:#C9A961;--rust:#B64926;--paper:#FDF9F0;--line:#06C755;
--mute:#7A7268;--light:#F8F5EE;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.serif{font-family:"Shippori Mincho",serif;}
.en{font-family:"Fraunces",serif;}

/* === CONTAINER === */
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;z-index:1;}

/* === PROGRESS BAR === */
.progress-wrap{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(244,239,230,0.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(26,36,25,0.08);}
.progress-inner{max-width:480px;margin:0 auto;padding:12px 20px 10px;}
.progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.progress-label span{font-size:12px;color:var(--mute);letter-spacing:0.1em;}
.progress-label .current{font-family:"Fraunces",serif;font-weight:700;font-size:14px;color:var(--green-deep);}
.progress-bar{height:4px;background:rgba(26,36,25,0.1);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--rust));border-radius:99px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);}

/* === SCREENS === */
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;padding:80px 24px 40px;opacity:0;transform:translateY(20px);transition:opacity 0.5s ease,transform 0.5s ease;}
.screen.active{display:flex;opacity:1;transform:translateY(0);}
.screen.exit{opacity:0;transform:translateY(-20px);}

/* === START SCREEN === */
.start{align-items:center;justify-content:center;text-align:center;}
.start .logo{font-family:"Shippori Mincho",serif;font-weight:800;font-size:32px;color:var(--green-deep);margin-bottom:4px;}
.start .logo span{color:var(--gold);}
.start .tagline{font-family:"Fraunces",serif;font-style:italic;font-size:13px;color:var(--gold);margin-bottom:48px;}
.start h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:28px;line-height:1.5;color:var(--green-deep);margin-bottom:16px;}
.start h1 em{font-style:normal;color:var(--rust);position:relative;}
.start h1 em::after{content:"";position:absolute;bottom:2px;left:0;right:0;height:10px;background:var(--gold);opacity:0.3;z-index:-1;}
.start p{font-size:15px;color:var(--mute);margin-bottom:40px;line-height:1.9;}
.start .features{display:flex;gap:20px;margin-bottom:40px;flex-wrap:wrap;justify-content:center;}
.start .feat{text-align:center;font-size:12px;color:var(--green-deep);}
.start .feat .ico{font-family:"Fraunces",serif;font-size:24px;color:var(--gold);display:block;margin-bottom:4px;}
.btn-start{background:var(--green-deep);color:var(--paper);padding:18px 48px;border-radius:999px;border:none;font-size:16px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif;cursor:pointer;transition:all .3s;box-shadow:0 8px 24px rgba(15,36,25,0.3);}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(15,36,25,0.4);}
.start .note{font-size:11px;color:var(--mute);margin-top:16px;}

/* === QUESTION SCREEN === */
.q-screen{justify-content:center;}
.q-num{font-family:"Fraunces",serif;font-style:italic;font-size:14px;color:var(--gold);letter-spacing:0.2em;margin-bottom:12px;}
.q-text{font-family:"Shippori Mincho",serif;font-weight:700;font-size:22px;line-height:1.6;color:var(--green-deep);margin-bottom:8px;}
.q-sub{font-size:13px;color:var(--mute);margin-bottom:28px;}
.q-multi-hint{font-size:12px;color:var(--rust);margin-bottom:16px;font-weight:500;}

/* === OPTIONS === */
.options{display:flex;flex-direction:column;gap:10px;}
.opt-btn{background:var(--paper);border:2px solid rgba(26,36,25,0.12);border-radius:14px;padding:14px 18px;font-size:15px;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--green-deep);cursor:pointer;transition:all .25s;text-align:left;font-weight:500;position:relative;overflow:hidden;}
.opt-btn:hover{border-color:var(--gold);background:#FFFDF7;}
.opt-btn.selected{border-color:var(--green-deep);background:var(--green-deep);color:var(--paper);}
.opt-btn.selected::after{content:"✓";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:16px;}

/* 2段階選択(都道府県) */
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pref-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.pref-grid .opt-btn{padding:10px 8px;font-size:13px;text-align:center;}

/* 複数選択用の確定ボタン */
.btn-confirm{background:var(--green-deep);color:var(--paper);padding:14px 32px;border-radius:999px;border:none;font-size:15px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif;cursor:pointer;margin-top:20px;transition:all .3s;opacity:0.4;pointer-events:none;}
.btn-confirm.enabled{opacity:1;pointer-events:auto;}
.btn-confirm.enabled:hover{transform:translateY(-2px);}

/* === LOADING === */
.loading{align-items:center;justify-content:center;text-align:center;}
.loading h2{font-family:"Shippori Mincho",serif;font-size:22px;color:var(--green-deep);margin-bottom:24px;}
.spinner{width:48px;height:48px;border:3px solid rgba(26,36,25,0.1);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px;color:var(--mute);}

/* === RESULT === */
.result{padding:80px 20px 40px;}
.result-header{text-align:center;margin-bottom:40px;}
.result-header .label{font-size:12px;letter-spacing:0.2em;color:var(--gold);margin-bottom:12px;}
.result-header h2{font-family:"Shippori Mincho",serif;font-weight:800;font-size:20px;color:var(--green-deep);line-height:1.6;margin-bottom:20px;}
.result-amount-box{background:var(--green-deep);border-radius:20px;padding:28px 24px;text-align:center;margin-bottom:12px;}
.result-amount-box .amt-label{font-size:12px;color:var(--gold);letter-spacing:0.15em;margin-bottom:8px;}
.result-amount-box .amt{font-family:"Fraunces",serif;font-weight:900;font-size:48px;color:var(--paper);letter-spacing:-0.02em;}
.result-amount-box .amt-unit{font-size:16px;color:rgba(253,249,240,0.7);margin-left:4px;}
.result-amount-box .amt-note{font-size:11px;color:rgba(253,249,240,0.5);margin-top:8px;}
.result-warn{font-size:11px;color:var(--mute);text-align:center;margin-bottom:32px;}

/* 制度カード */
.seido-section{margin-bottom:32px;}
.seido-section-title{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.seido-section-title .badge{font-size:20px;}
.seido-section-title span{font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;color:var(--green-deep);}

.seido-card{background:var(--paper);border-radius:16px;padding:20px;margin-bottom:12px;border:1px solid rgba(26,36,25,0.06);box-shadow:0 2px 12px rgba(15,36,25,0.06);}
.seido-card .s-name{font-family:"Shippori Mincho",serif;font-weight:700;font-size:17px;color:var(--green-deep);margin-bottom:10px;}
.seido-card .s-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.seido-card .s-tag{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500;}
.seido-card .s-tag.money{background:rgba(182,73,38,0.1);color:var(--rust);}
.seido-card .s-tag.diff{background:rgba(201,169,97,0.15);color:#8B7332;}
.seido-card .s-desc{font-size:14px;line-height:1.8;color:#3a3a3a;margin-bottom:12px;}
.seido-card .s-how{font-size:13px;line-height:1.7;color:var(--mute);padding:12px;background:var(--bg);border-radius:10px;margin-bottom:10px;}
.seido-card .s-how strong{color:var(--green-deep);font-size:12px;display:block;margin-bottom:4px;letter-spacing:0.1em;}
.seido-card .s-link{display:inline-block;font-size:13px;color:var(--green);text-decoration:none;font-weight:500;border-bottom:1px solid var(--gold);}
.seido-card .s-link:hover{color:var(--rust);}

/* CTAボタン群 */
.result-cta{margin-top:40px;display:flex;flex-direction:column;gap:12px;}
.btn-line-cta{background:var(--line);color:#fff;padding:16px 24px;border-radius:999px;border:none;font-size:15px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif;cursor:pointer;text-decoration:none;text-align:center;display:block;transition:all .3s;box-shadow:0 6px 20px rgba(6,199,85,0.3);}
.btn-line-cta:hover{transform:translateY(-2px);}
.btn-x-share{background:var(--green-deep);color:var(--paper);padding:14px 24px;border-radius:999px;border:none;font-size:14px;font-weight:700;font-family:"Zen Kaku Gothic New",sans-serif;cursor:pointer;text-decoration:none;text-align:center;display:block;transition:all .3s;}
.btn-secondary{background:transparent;color:var(--green-deep);padding:12px 24px;border-radius:999px;border:2px solid rgba(26,36,25,0.15);font-size:13px;font-weight:500;font-family:"Zen Kaku Gothic New",sans-serif;cursor:pointer;text-decoration:none;text-align:center;display:block;transition:all .3s;}
.btn-secondary:hover{border-color:var(--gold);}

/* footer */
.result-footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid rgba(26,36,25,0.1);}
.result-footer .logo-sm{font-family:"Shippori Mincho",serif;font-weight:800;font-size:18px;color:var(--green-deep);}
.result-footer .logo-sm span{color:var(--gold);}
.result-footer p{font-size:11px;color:var(--mute);margin-top:4px;}
</style>
</head>
<body>
<div class="app" id="app">

<!-- Progress Bar -->
<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-inner">
    <div class="progress-label">
      <span class="current" id="progressText">1 / 10</span>
      <span>3分診断</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
  </div>
</div>

<!-- Start Screen -->
<div class="screen active" id="screenStart">
  <div class="start">
    <div class="logo">トリ<span>モド</span></div>
    <div class="tagline">Recover what's yours</div>
    <h1>あなたが<br>知らずに捨てている<br><em>お金</em>、<br>いくらか知っていますか?</h1>
    <p>日本には1万件超の補助金・助成金・<br>控除制度があります。<br>3分の診断で、あなたが受給できる<br>制度と金額が分かります。</p>
    <div class="features">
      <div class="feat"><span class="ico">3'</span>たった3分</div>
      <div class="feat"><span class="ico">¥0</span>完全無料</div>
      <div class="feat"><span class="ico">10</span>10問だけ</div>
    </div>
    <button class="btn-start" onclick="startDiagnosis()">無料診断をはじめる</button>
    <div class="note">個人情報は一切保存されません</div>
  </div>
</div>

<!-- Question Screens (generated by JS) -->
<div id="questionContainer"></div>

<!-- Loading Screen -->
<div class="screen" id="screenLoading">
  <div class="loading">
    <div class="spinner"></div>
    <h2>あなたの制度を<br>分析しています...</h2>
    <p id="loadingMsg">1万件超の制度データベースから検索中</p>
  </div>
</div>

<!-- Result Screen -->
<div class="screen" id="screenResult">
  <div class="result" id="resultContent"></div>
</div>

</div>

<script>
// ===== 質問データ =====
const questions = [
  {
    id:"work", num:1, text:"現在の働き方は?", sub:"最も近いものを1つ選んでください",
    multi:false,
    opts:[
      {v:"fulltime",l:"会社員(正社員)"},
      {v:"contract",l:"会社員(契約・派遣)"},
      {v:"freelance",l:"個人事業主・フリーランス"},
      {v:"executive",l:"経営者・法人役員"},
      {v:"part",l:"パート・アルバイト"},
      {v:"student",l:"学生"},
      {v:"unemployed",l:"無職・求職中"}
    ]
  },
  {
    id:"age", num:2, text:"年齢を教えてください", sub:"",
    multi:false,
    opts:[
      {v:"10s",l:"10代"},{v:"20s",l:"20代"},{v:"30s",l:"30代"},
      {v:"40s",l:"40代"},{v:"50s",l:"50代"},{v:"60_64",l:"60〜64歳"},{v:"65plus",l:"65歳以上"}
    ]
  },
  {
    id:"income", num:3, text:"昨年の年収(税込)は\nおよそいくらですか?", sub:"",
    multi:false,
    opts:[
      {v:"0",l:"収入なし"},{v:"u100",l:"〜100万円"},{v:"100_200",l:"100〜200万円"},
      {v:"200_400",l:"200〜400万円"},{v:"400_600",l:"400〜600万円"},
      {v:"600_800",l:"600〜800万円"},{v:"800plus",l:"800万円以上"}
    ]
  },
  {
    id:"region", num:4, text:"お住まいの地域は?", sub:"まず地方を選んでください",
    multi:false, type:"region"
  },
  {
    id:"family", num:5, text:"ご家族の構成は?", sub:"最も近いものを1つ選んでください",
    multi:false,
    opts:[
      {v:"single",l:"独身(子なし)"},{v:"couple",l:"夫婦のみ(子なし)"},
      {v:"child_pre",l:"子どもあり(未就学児)"},{v:"child_elem",l:"子どもあり(小中学生)"},
      {v:"child_high",l:"子どもあり(高校生以上)"},{v:"single_parent",l:"ひとり親"}
    ]
  },
  {
    id:"housing", num:6, text:"住まいの状況は?", sub:"",
    multi:false,
    opts:[
      {v:"rent_work",l:"賃貸(自宅で仕事もする)"},
      {v:"rent_nowork",l:"賃貸(自宅では仕事しない)"},
      {v:"own_loan",l:"持ち家(住宅ローンあり)"},
      {v:"own_paid",l:"持ち家(ローン完済済み)"},
      {v:"family_home",l:"実家暮らし"}
    ]
  },
  {
    id:"events", num:7, text:"この1年で起きた\n出来事はありますか?", sub:"",
    multi:true, hint:"あてはまるものを全て選んでください",
    opts:[
      {v:"birth",l:"出産(予定含む)"},{v:"marriage",l:"結婚"},
      {v:"job_change",l:"転職"},{v:"job_loss",l:"退職(失業中)"},
      {v:"startup",l:"起業・開業"},{v:"move",l:"引越し"},
      {v:"income_drop",l:"収入が大きく減った"},{v:"none",l:"該当なし"}
    ]
  },
  {
    id:"insurance", num:8, text:"加入している\n健康保険は?", sub:"",
    multi:false,
    opts:[
      {v:"company",l:"会社の健康保険(社会保険)"},
      {v:"national",l:"国民健康保険"},
      {v:"dependent",l:"家族の扶養に入っている"},
      {v:"unknown",l:"わからない"}
    ]
  },
  {
    id:"using", num:9, text:"既に使っている制度は\nありますか?", sub:"",
    multi:true, hint:"あてはまるものを全て選んでください",
    opts:[
      {v:"furusato",l:"ふるさと納税"},{v:"ideco",l:"iDeCo"},
      {v:"nisa",l:"NISA"},{v:"shokibo",l:"小規模企業共済"},
      {v:"aoiro",l:"青色申告"},{v:"iryohi",l:"医療費控除"},
      {v:"safety",l:"経営セーフティ共済"},{v:"none_used",l:"どれも使っていない"}
    ]
  },
  {
    id:"interest", num:10, text:"特に関心があることは?", sub:"",
    multi:true, hint:"あてはまるものを全て選んでください",
    opts:[
      {v:"tax_save",l:"毎年の税金を減らしたい"},
      {v:"benefits",l:"使える給付金を知りたい"},
      {v:"biz_subsidy",l:"事業の補助金を活用したい"},
      {v:"child_support",l:"子育て関連の支援を知りたい"},
      {v:"future_asset",l:"将来の資産を増やしたい"},
      {v:"housing_support",l:"住宅関連の控除や補助を知りたい"}
    ]
  }
];

// ===== 地域・都道府県データ =====
const regions = {
  "hokkaido_tohoku":{name:"北海道・東北",prefs:["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県"]},
  "kanto":{name:"関東",prefs:["東京都","神奈川県","千葉県","埼玉県","茨城県","栃木県","群馬県"]},
  "chubu":{name:"中部",prefs:["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"]},
  "kinki":{name:"近畿",prefs:["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"]},
  "chugoku_shikoku":{name:"中国・四国",prefs:["鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県"]},
  "kyushu":{name:"九州・沖縄",prefs:["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]}
};

// ===== 制度データ =====
const allSeido = [
  {
    id:"shokibo", name:"小規模企業共済", cat:"節税",
    amount_min:24000, amount_max:168000, amount_label:"年24,000〜168,000円の節税",
    diff:"★☆☆", diff_label:"簡単",
    desc:"フリーランスの退職金制度。月1,000円から加入でき、掛金は全額所得控除。加入率は全体の約10%で、90%の人が取りこぼしている。",
    how:"商工会議所または金融機関の窓口で「加入申込書」を提出。必要書類は確定申告書の写しと本人確認書類のみ。",
    url:"https://www.smrj.go.jp/kyosai/skyosai/",
    cond: a => (a.work==="freelance"||a.work==="executive") && !a.using.includes("shokibo")
  },
  {
    id:"aoiro", name:"青色申告特別控除", cat:"節税",
    amount_min:100000, amount_max:130000, amount_label:"年約10万〜13万円の節税",
    diff:"★★☆", diff_label:"やや手間あり",
    desc:"複式簿記+e-Taxで最大65万円の所得控除。白色申告のままだと、毎年10万円以上の節税機会を逃していることになる。",
    how:"税務署に「青色申告承認申請書」を提出(開業から2ヶ月以内、または翌年3月15日まで)。会計ソフト(freee等)で複式簿記は簡単に対応可能。",
    url:"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2072.htm",
    cond: a => (a.work==="freelance"||a.work==="executive") && !a.using.includes("aoiro")
  },
  {
    id:"kajianbun", name:"家事按分", cat:"節税",
    amount_min:50000, amount_max:120000, amount_label:"年5万〜12万円の経費化",

// ===== 状態管理 =====
let answers = {};
let currentQ = 0;
let multiSelected = [];
let regionStep = "region"; // "region" or "pref"
let selectedRegion = "";

// ===== スタート =====
function startDiagnosis(){
  document.getElementById("screenStart").classList.remove("active");
  document.getElementById("progressWrap").style.display="block";
  currentQ = 0;
  answers = {};
  renderQuestion(0);
}

// ===== 質問レンダリング =====
function renderQuestion(idx){
  const q = questions[idx];
  const container = document.getElementById("questionContainer");
  
  // 古い画面をフェードアウト
  const old = container.querySelector(".screen.active");
  if(old){ old.classList.add("exit"); old.classList.remove("active"); }
  
  setTimeout(()=>{
    container.innerHTML = "";
    const div = document.createElement("div");
    div.className = "screen q-screen";
    div.id = `q${idx}`;

    let html = `<div class="q-num">QUESTION ${q.num} / 10</div>`;
    html += `<div class="q-text">${q.text.replace(/\n/g,"<br>")}</div>`;
    if(q.sub) html += `<div class="q-sub">${q.sub}</div>`;
    if(q.multi) html += `<div class="q-multi-hint">${q.hint}</div>`;

    if(q.type === "region"){
      html += renderRegionSelect();
    } else {
      html += `<div class="options">`;
      q.opts.forEach((o,i) => {
        html += `<button class="opt-btn" data-val="${o.v}" onclick="${q.multi ? `toggleMulti(this,'${q.id}')` : `selectAnswer('${q.id}','${o.v}')`}">${o.l}</button>`;
      });
      html += `</div>`;
      if(q.multi){
        html += `<button class="btn-confirm" id="btnConfirm" onclick="confirmMulti('${q.id}')">この内容で次へ進む</button>`;
      }
    }

    div.innerHTML = html;
    container.appendChild(div);
    
    // アニメーション
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ div.classList.add("active"); });
    });
    
    updateProgress(idx);
    multiSelected = [];
    regionStep = "region";
  }, old ? 300 : 0);
}

function renderRegionSelect(){
  let html = `<div class="options region-grid">`;
  Object.keys(regions).forEach(k => {
    html += `<button class="opt-btn" onclick="selectRegion('${k}')">${regions[k].name}</button>`;
  });
  html += `</div>`;
  return html;
}

function selectRegion(rk){
  selectedRegion = rk;
  const container = document.getElementById("questionContainer");
  const screen = container.querySelector(".screen.active");
  
  // 地方→都道府県に切り替え
  const q = questions[currentQ];
  let html = `<div class="q-num">QUESTION ${q.num} / 10</div>`;
  html += `<div class="q-text">お住まいの都道府県は?</div>`;
  html += `<div class="q-sub">${regions[rk].name}の都道府県を選んでください</div>`;
  html += `<div class="options pref-grid">`;
  regions[rk].prefs.forEach(p => {
    html += `<button class="opt-btn" onclick="selectAnswer('pref','${p}')">${p}</button>`;
  });
  html += `</div>`;
  html += `<button class="btn-secondary" style="margin-top:16px" onclick="renderQuestion(${currentQ})">地方選択に戻る</button>`;
  
  screen.innerHTML = html;
}

// ===== 単一選択 =====
function selectAnswer(id, val){
  answers[id] = val;
  
  // ボタンの視覚フィードバック
  const btns = document.querySelectorAll(".q-screen.active .opt-btn");
  btns.forEach(b => b.classList.remove("selected"));
  event.target.classList.add("selected");
  
  // 次の質問へ(少し待ってアニメーション)
  setTimeout(()=>{
    currentQ++;
    if(currentQ < questions.length){
      renderQuestion(currentQ);
    } else {
      showLoading();
    }
  }, 350);
}

// ===== 複数選択 =====
function toggleMulti(btn, qid){
  const val = btn.dataset.val;
  
  // 「該当なし」「どれも使っていない」の排他制御
  if(val === "none" || val === "none_used"){
    multiSelected = [val];
    document.querySelectorAll(".q-screen.active .opt-btn").forEach(b => {
      b.classList.remove("selected");
      if(b.dataset.val === val) b.classList.add("selected");
    });
  } else {
    // 「該当なし」系を外す
    multiSelected = multiSelected.filter(v => v !== "none" && v !== "none_used");
    document.querySelectorAll(".q-screen.active .opt-btn").forEach(b => {
      if(b.dataset.val === "none" || b.dataset.val === "none_used") b.classList.remove("selected");
    });
    
    if(multiSelected.includes(val)){
      multiSelected = multiSelected.filter(v => v !== val);
      btn.classList.remove("selected");
    } else {
      multiSelected.push(val);
      btn.classList.add("selected");
    }
  }
  
  // 確定ボタンの有効化
  const confirmBtn = document.getElementById("btnConfirm");
  if(confirmBtn){
    if(multiSelected.length > 0){
      confirmBtn.classList.add("enabled");
    } else {
      confirmBtn.classList.remove("enabled");
    }
  }
}

function confirmMulti(qid){
  if(multiSelected.length === 0) return;
  answers[qid] = [...multiSelected];
  
  currentQ++;
  if(currentQ < questions.length){
    renderQuestion(currentQ);
  } else {
    showLoading();
  }
}

// ===== プログレスバー =====
function updateProgress(idx){
  const pct = ((idx + 1) / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${idx + 1} / ${questions.length}`;
}

// ===== ローディング =====
function showLoading(){
  document.getElementById("questionContainer").innerHTML = "";
  const loadScreen = document.getElementById("screenLoading");
  loadScreen.classList.add("active");
  updateProgress(questions.length - 1);
  document.getElementById("progressFill").style.width = "100%";
  
  const msgs = [
    "1万件超の制度データベースから検索中...",
    "あなたの条件にマッチする制度を抽出中...",
    "推定取りこぼし額を計算中...",
    "結果をまとめています..."
  ];
  let mi = 0;
  const msgEl = document.getElementById("loadingMsg");
  const msgTimer = setInterval(()=>{
    mi++;
    if(mi < msgs.length) msgEl.textContent = msgs[mi];
  }, 800);
  
  setTimeout(()=>{
    clearInterval(msgTimer);
    loadScreen.classList.remove("active");
    document.getElementById("progressWrap").style.display = "none";
    showResult();
  }, 3500);
}

// ===== 結果計算 =====
function showResult(){
  // answersからマルチ選択をarrayに正規化
  const a = {
    work: answers.work || "",
    age: answers.age || "",
    income: answers.income || "",
    pref: answers.pref || "",
    family: answers.family || "",
    housing: answers.housing || "",
    events: Array.isArray(answers.events) ? answers.events : [],
    insurance: answers.insurance || "",
    using: Array.isArray(answers.using) ? answers.using : [],
    interest: Array.isArray(answers.interest) ? answers.interest : []
  };
  
  // 制度マッチング
  const matched = allSeido.filter(s => {
    try { return s.cond(a); } catch(e){ return false; }
  });
  
  // 合計金額計算(min/max)
  let totalMin = 0, totalMax = 0;
  matched.forEach(s => {
    totalMin += s.amount_min;
    totalMax += s.amount_max;
  });
  
  // 優先度でソート(金額大きい順)
  matched.sort((a,b) => (b.amount_max - a.amount_max));
  
  // 最大8件に制限
  const top = matched.slice(0, 8);
  const priority1 = top.slice(0, 3);
  const priority2 = top.slice(3, 6);
  const priority3 = top.slice(6, 8);
  
  // 金額フォーマット
  const fmtYen = n => {
    if(n === 0) return "—";
    return "¥" + n.toLocaleString();
  };
  
  // 結果HTML構築
  let html = `<div class="result-header">`;
  html += `<div class="label">DIAGNOSIS RESULT</div>`;
  html += `<h2 class="serif">あなたは今、<br>これだけのお金を<br>取りこぼしています。</h2>`;
  html += `<div class="result-amount-box">`;
  html += `<div class="amt-label">推定 年間取りこぼし額</div>`;
  
  if(totalMax > 0){
    if(totalMin !== totalMax){
      html += `<div class="amt en">${fmtYen(totalMin)}<span class="amt-unit">〜</span>${fmtYen(totalMax)}</div>`;
    } else {
      html += `<div class="amt en">${fmtYen(totalMax)}</div>`;
    }
  } else {
    html += `<div class="amt en">要確認</div>`;
  }
  html += `<div class="amt-unit">/ 年</div>`;
  html += `<div class="amt-note">該当制度: ${matched.length}件</div>`;
  html += `</div></div>`;
  
  html += `<div class="result-warn">※本診断は推定です。実際の受給可否は各窓口でご確認ください。</div>`;
  
  // 制度カードセクション
  function renderSeidoSection(title, badge, list){
    if(list.length === 0) return "";
    let s = `<div class="seido-section">`;
    s += `<div class="seido-section-title"><span class="badge">${badge}</span><span>${title}</span></div>`;
    list.forEach(item => {
      s += `<div class="seido-card">`;
      s += `<div class="s-name">${item.name}</div>`;
      s += `<div class="s-meta">`;
      s += `<span class="s-tag money">${item.amount_label}</span>`;
      s += `<span class="s-tag diff">${item.diff} ${item.diff_label}</span>`;
      s += `</div>`;
      s += `<div class="s-desc">${item.desc}</div>`;
      s += `<div class="s-how"><strong>申請方法</strong>${item.how}</div>`;
      if(item.url){
        s += `<a class="s-link" href="${item.url}" target="_blank" rel="noopener">公式サイトで詳細を見る →</a>`;
      }
      s += `</div>`;
    });
    s += `</div>`;
    return s;
  }
  
  html += renderSeidoSection("最優先で検討すべき制度", "🥇", priority1);
  html += renderSeidoSection("次に検討すべき制度", "🥈", priority2);
  html += renderSeidoSection("余裕があれば活用したい制度", "🥉", priority3);
  
  if(matched.length === 0){
    html += `<div class="seido-section"><div class="seido-card"><div class="s-desc">現在の条件では該当する制度が見つかりませんでした。条件が変わった場合は再度診断をお試しください。</div></div></div>`;
  }
  
  // CTA
  const totalLabel = totalMax > 0 ? `年間${fmtYen(totalMin)}〜${fmtYen(totalMax)}` : "該当制度";
  const shareText = encodeURIComponent(`トリモドで診断したら、年間${totalMax > 0 ? Math.round(totalMax/10000)+"万円" : "◯万円"}の取りこぼしが見つかりました...\n\n無料で3分診断できます👇\nhttps://harutouenishi-rgb.github.io/torimodo/shindan.html`);
  
  html += `<div class="result-cta">`;
  html += `<a class="btn-line-cta" href="https://lin.ee/Y76Guyt" target="_blank" rel="noopener">LINEで申請サポートを相談する</a>`;
  html += `<a class="btn-x-share" href="https://twitter.com/intent/tweet?text=${shareText}" target="_blank" rel="noopener">この結果をXでシェアする</a>`;
  html += `<button class="btn-secondary" onclick="location.reload()">もう一度診断する</button>`;
  html += `<a class="btn-secondary" href="https://harutouenishi-rgb.github.io/torimodo/" target="_blank" rel="noopener">トリモドについて詳しく見る</a>`;
  html += `</div>`;
  
  // フッター
  html += `<div class="result-footer">`;
  html += `<div class="logo-sm serif">トリ<span>モド</span></div>`;
  html += `<p>Recover what's yours</p>`;
  html += `</div>`;
  
  document.getElementById("resultContent").innerHTML = html;
  document.getElementById("screenResult").classList.add("active");
  window.scrollTo(0, 0);
}
</script>
